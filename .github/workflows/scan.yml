name: Azure Resource Cleaner

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.ARM_CLIENT_ID || vars.ARM_CLIENT_ID }}",
            "clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}",
            "subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID || vars.ARM_SUBSCRIPTION_ID }}",
            "tenantId":"${{ secrets.ARM_TENANT_ID || vars.ARM_TENANT_ID }}"}

      - name: Show Azure Account
        run: az account show

      - name: Show Selected Resource Group
        run: |
          echo "Resource group: ${{ inputs.resource_group }}"

      - name: List Resources in Resource Group
        run: |
          az resource list --resource-group "${{ inputs.resource_group }}" --output table